# Конфигурация гейтов объёма (ADR-031 плагина nauta). Отдельный файл, потому что
# content/.doc-root.yaml принадлежит Gramax и конфигурацию гейтов не несёт.
#
# Файла нет -> C11/C13/C14 тихо тривиальны, и "Errors: 0" валидатора означает
# "не проверялось", а не "нарушений нет". Файл малформенный -> error.
#
# ПОРОГИ ОТКАЛИБРОВАНЫ ЗАМЕРОМ ЭТОГО РЕПОЗИТОРИЯ 2026-08-13, шаблонные значения не
# копировались. Замер, обоснование каждого порога и правило пересмотра:
# content/40-architecture/ADR-001-nauta-contour-spec.md

# --- C11: объём статей content/ -------------------------------------------------------
# Парная метрика: сигнал только когда T превышен И качественный признак провален.
# Тип без записи здесь — легитимный статус «T не измерен» (FR-003), не пробел: остальные
# типы не заведены осознанно, корпус пуст и калибровать не по чему.
sizeBudgets:
  # Шаблонный порог принят без изменения: ADR — это решение, а не спецификация.
  # Процедурная детализация выносится в companion-спеку <stem>-spec.md.
  - type: ADR
    thresholdLines: 150
    quality: companion-spec
    severity: block

# --- C13: объём кода ------------------------------------------------------------------
# Расширение без записи не гейтится вовсе (.sh, .toml, .json) — это «не измерено».
codeSizeBudgets:
  # prod: единственное срабатывание на замере — registry.py (562 строки, класс Registry
  # на 208). formatters.py при 370 строках проходит молча (decl=51) — это контейнер из
  # тридцати коротких форматтеров, а не стена текста, и молчание здесь правильный исход.
  - extension: .py
    kind: prod
    thresholdLines: 350
    qualityThreshold: 100
    severity: block

  # test: T_S=150 при фактическом максимуме 109 (test_formatters.py) — сегодня не
  # срабатывает никто, порог живой при разрастании тест-класса в полтора раза.
  # warn, а не block: раздутый тест — повод для рефакторинга, не для блокировки коммита.
  - extension: .py
    kind: test
    thresholdLines: 600
    qualityThreshold: 150
    severity: warn

# --- C14: объём корневого промт-слоя --------------------------------------------------
# Сумма строк CLAUDE.md + AGENTS.md. AGENTS.md в проекте нет — отсутствующий файл даёт 0
# к сумме, это штатный исход. Один признак без пары: контекстное окно тратится на длину
# независимо от структуры, второй признак здесь нечего страховать.
promptLayerSizeBudget:
  thresholdLines: 200
  severity: block

# --- Грандфазер -----------------------------------------------------------------------
# Заморозка фактического размера на день включения гейта, а не индульгенция: пока файл
# в пределах ceiling — warning без блокировки, первая строка сверх — error.
# Снимается расщеплением класса, не поднятием потолка (ADR-032 Д7, ADR-018 Д5).
# Путь repo-root-relative, "/"-separated, без ведущего "./".
sizeBudgetGrandfathered:
  - path: src/ktalk_cli/registry.py
    ceiling: 562

  # Ниже — НЕ наш долг, а payload плагина nauta (`/nauta:sync-scripts`). C13 перечисляет
  # файлы через `git ls-files` и не умеет исключать пути, поэтому вендоренные скрипты
  # гейтятся наравне с нашим кодом. Расщепить их нельзя — они перезаписываются синком.
  # Потолок = размер на версии плагина 0.26.0; после обновления payload'а гейт может
  # заблокировать коммит — тогда потолок обновляется под новый размер, это ожидаемая
  # операция, а не решение о долге. Сработавший при синке 0.26.0 кандидат —
  # validate-content.py (1658 строк при T=350, decl=117 >= T_S=100), запись заведена ниже.
  - path: scripts/_drift_check.py
    ceiling: 501
  - path: scripts/validate-profile.py
    ceiling: 724
  - path: scripts/validate-content.py
    ceiling: 1658
