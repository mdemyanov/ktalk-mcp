# Финальная версия-указатель пакета `ktalk-mcp` (ADR-022 решение 6).
#
# Пакет НЕ несёт прикладного кода и зависимостей. Его единственная задача —
# сказать тому, кто пришёл по старому имени, куда переехал продукт.
#
# Команду `ktalk` он НЕ объявляет намеренно. Замер поведения `uv tool` показал:
# два пакета, претендующих на одно имя команды, конфликтуют — установка второго
# без форсирующего флага отказывает с кодом 2. Указатель, сохранивший `ktalk`,
# владел бы слотом и ломал бы штатную установку `ktalk-cli`.
[project]
name = "ktalk-mcp"
version = "0.11.0"
description = "Переехало в ktalk-cli. Пакет-указатель, прикладного кода не содержит."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.scripts]
ktalk-mcp = "ktalk_mcp.pointer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ktalk_mcp"]

[tool.hatch.build.targets.sdist]
include = ["/src/", "/README.md", "/pyproject.toml"]
